plugins {
	id 'fabric-loom' version '1.8-SNAPSHOT'
	id 'maven-publish'
}

version = "1.0.0"
group = "com.benluvzbacon.ironworks"
base { archivesName = "ironworks-steam-age" }

repositories {
    mavenCentral()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
	minecraft "com.mojang:minecraft:1.21.1"
	mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
	modImplementation "net.fabricmc:fabric-loader:0.16.5"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.0+1.21.1"
    modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:19.32.0.358"
    modLocalRuntime "mezz.jei:jei-1.21.1-fabric:19.32.0.358"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "loader_version": "0.16.5", "minecraft_version": "1.21.1"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}



